name: ci
on: [push, pull_request]
jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs, not tags: a tag is mutable, so
      # `@v7` lets an upstream retag silently change what executes here. The
      # trailing comment records which release each SHA corresponds to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: npm ci && npm run build
      - run: npm test
      - run: make demo
      - run: make calibrate
      - run: make pytest
      # Re-run the row-status annotator over the committed preview. It is
      # idempotent, so a clean tree afterwards proves the released bytes still
      # match what the annotator produces. Without this the preview could be
      # regenerated upstream and committed unannotated -- which is exactly how the
      # site and this repo came to serve two different previews under one name.
      - run: python3 analysis/add_status_fields.py
      - run: python3 analysis/verify_stats.py
      # Figures were the one generated artifact outside the drift gate, so when
      # the grid grew from 11 to 13 endpoints the prose and tables regenerated
      # from paper-stats.json and the plots silently did not. --check needs no
      # plotting stack: it recomputes every plotted value from paper-stats.json
      # and re-hashes the committed PDFs against figure-data.json.
      - run: make figures-check
      - run: bash scripts/secret-guard.sh
      # The Python suite mutates generated artifacts (gen-macros rewrites
      # paper/result-macros.tex). If a run leaves the tree dirty, a committed
      # artifact is stale relative to its generator -- fail rather than drift.
      - run: git diff --exit-code
